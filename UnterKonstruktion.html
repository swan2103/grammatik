<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Im Aufbau</title>
<style>

  html,body{margin:0;padding:0;height:100%;font-family:'Comic Sans MS','Comic Neue',Bubblegum,'Baloo 2',sans-serif;background:#faf7f0;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}

<body>
  <div class="box">
    <div class="icon">🚧</div>

    const title = params.get('titel');
    if(title) document.getElementById('pageTitle').textContent = title;
