<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Verbtheater – Trainingsspiel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
  :root{
    --green:#2fa32f; --yellow:#e0b400; --purple:#9662c8; --stage-bg:#faf7f0;
    --stage-w: min(84vw,640px); --vw: 100vw; --vh: 100vh;
  }
  *{box-sizing:border-box;}
  html{height:100%;}
  html,body{margin:0;padding:0;height:100%;font-family:'Comic Sans MS','Comic Neue',Bubblegum,'Baloo 2',sans-serif;background:var(--stage-bg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  #rotateWrapper{width:100%;height:100%;}
  @media screen and (orientation:portrait){
    :root{ --stage-w: min(84vh,640px); }
    #rotateWrapper{
      position:absolute;
      top:0; left:100%;
      width:var(--vh);
      height:var(--vw);
      transform-origin:0 0;
      transform:rotate(90deg);
    }
  }
  #app{position:relative;width:100%;height:100%;}

  #doneRail{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:5;}
  .doneIcon{width:46px;height:32px;border-radius:6px;overflow:hidden;filter:grayscale(1) brightness(1.15);opacity:.75;cursor:pointer;border:2px solid #bbb;}
  .doneIcon img{width:100%;height:100%;object-fit:cover;}
  .doneIcon:hover{opacity:1;filter:grayscale(.4);}

  #endScreen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:24px 20px;overflow-y:auto;}
  #endScreen h1{font-size:clamp(28px,5vw,44px);color:#4a4a4a;text-align:center;margin:6px 0 0;}
  #endClap{font-size:clamp(36px,6vw,54px);text-align:center;margin:0 0 10px;cursor:pointer;}
  #endScreen p{font-size:18px;color:#777;}
  #endMenu{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px;max-width:min(94vw,700px);}
  .endBtn{font-size:17px;padding:12px 20px;border-radius:14px;border:3px solid var(--green);background:#fff;color:#2a2a2a;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .12s;}
  .endBtn:hover{transform:scale(1.03);}
  .endBtn:active{transform:scale(.97);}

  #printSheet{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printSheet, #printSheet *{visibility:visible;}
    #printSheet{display:block;position:absolute;top:0;left:0;width:100%;}
    .printCard{page-break-inside:avoid;display:inline-block;width:46%;margin:2%;text-align:center;vertical-align:top;}
    .printCard img{width:100%;border:1px solid #999;border-radius:6px;}
    .printCard p{font-size:14px;margin-top:6px;}
  }

  /* ---------- ROUND SCREEN ---------- */
  #roundScreen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:10px 10px 6px;overflow:hidden;}
  #topBar{display:flex;justify-content:space-between;align-items:flex-start;width:100%;max-width:760px;min-height:24px;}
  #hintText{font-size:15px;color:#777;max-width:460px;}
  #palette{display:flex;gap:10px;}
  .colorBlob{width:calc(var(--stage-w)*0.09);height:calc(var(--stage-w)*0.09);border-radius:50%;cursor:grab;box-shadow:0 2px 4px rgba(0,0,0,.3);border:2px solid rgba(0,0,0,.15);touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;}
  .colorBlob.dragging{opacity:.55;}
  .blob-green{background:var(--green);}
  .blob-yellow{background:var(--yellow);}
  .blob-purple{background:var(--purple);}

  #verbLabel{position:absolute;background:#fff;border:3px solid #999;border-radius:14px;padding:calc(var(--stage-w)*0.009) calc(var(--stage-w)*0.025);font-size:calc(var(--stage-w)*0.0297);color:#2a2a2a;box-shadow:0 3px 6px rgba(0,0,0,.2);transform:translate(-50%,-50%) scale(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;white-space:nowrap;z-index:4;}
  #verbLabel.show{transform:translate(-50%,-50%) scale(1);}

  #verbChoices{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:12px;justify-content:flex-start;max-width:640px;margin-top:10px;min-height:52px;padding-bottom:4px;}
  .verbBubble{background:#fff;border:3px solid #999;border-radius:40px;padding:calc(var(--stage-w)*0.008) calc(var(--stage-w)*0.02);font-size:calc(var(--stage-w)*0.0297);cursor:grab;box-shadow:0 3px 0 rgba(0,0,0,.15);user-select:none;touch-action:none;transition:transform .15s;white-space:nowrap;flex-shrink:0;}
  .verbBubble.dragging{opacity:.4;}
  .verbBubble.wrongShake{animation:bshake .35s;}
  @keyframes bshake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px) rotate(-3deg);}75%{transform:translateX(8px) rotate(3deg);}}

  #stageWrap{position:relative;flex:1 1 0;min-height:0;min-width:0;max-width:100%;max-height:100%;aspect-ratio:600/422;margin-top:10px;border-radius:10px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.18);background:#fff;-webkit-touch-callout:none;-webkit-user-select:none;}
  #stageImg{width:100%;height:100%;display:block;object-fit:cover;-webkit-touch-callout:none;-webkit-user-select:none;pointer-events:none;}
  .maskImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;transition:opacity .18s;}
  .hitZone{position:absolute;background:transparent;}
  #stageWrap.shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  #sentenceArea{margin-top:4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:70px;width:100%;max-width:640px;}
  #sentenceRow{display:flex;align-items:center;gap:10px;width:100%;justify-content:center;}
  #slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .slot{min-width:110px;height:44px;border:3px dashed #ccc;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;padding:0 10px;}
  .slot.slot-nom{border-color:rgba(47,163,47,.65);}
  .slot.slot-akk{border-color:rgba(224,180,0,.8);}
  .slot.slot-dat{border-color:rgba(150,98,200,.75);}
  .slot.slot-verb{border-color:#ccc;}
  .slot.filled{border-style:solid;background:#fff;}
  .slot.hop{animation:hop .5s;}
  .slot.shake{animation:shake .3s;}
  @keyframes hop{0%,100%{transform:translateY(0);}30%{transform:translateY(-14px);}55%{transform:translateY(0);}75%{transform:translateY(-7px);}}

  #tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .tile{background:#fff;border:2px solid #999;border-radius:10px;padding:8px 16px;font-size:16px;cursor:grab;box-shadow:0 2px 0 rgba(0,0,0,.12);touch-action:none;}
  .tile.tile-nom{border-color:var(--green);}
  .tile.tile-akk{border-color:var(--yellow);}
  .tile.tile-dat{border-color:var(--purple);}
  .tile.tile-verb{border-color:#999;}
  .tile.dragging{opacity:.5;}
  .tile.hidden{display:none;}

  #voiceRow{display:none;align-items:center;justify-content:center;gap:14px;width:100%;max-width:400px;}
  .iconBtn{width:calc(var(--stage-w)*0.0906);height:calc(var(--stage-w)*0.0906);border-radius:50%;border:none;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);font-size:calc(var(--stage-w)*0.0406);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s;}
  .iconBtn:hover{transform:scale(1.08);}
  .iconBtn:active{transform:scale(.92);}
  .iconBtn.speakerBtn{border:3px solid var(--green);}
  .iconBtn.micBtn{border:3px solid #d9534f;}
  .iconBtn.micBtn.recording{background:#d9534f;color:#fff;animation:pulse 1s infinite;}
  .iconBtn.playbackBtn{border:3px solid #999;opacity:.4;}
  .iconBtn.playbackBtn.ready{opacity:1;pointer-events:auto;border-color:var(--yellow);}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,83,79,.5);}50%{box-shadow:0 0 0 8px rgba(217,83,79,0);}}

  #bottomBar{width:var(--stage-w);display:flex;align-items:flex-start;justify-content:flex-end;margin-top:0px;gap:12px;}
  #bottomRight{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  #nextBtn{display:inline-flex;visibility:hidden;align-items:center;gap:8px;font-size:calc(var(--stage-w)*0.0281);padding:calc(var(--stage-w)*0.0156) calc(var(--stage-w)*0.0344);border-radius:30px;border:none;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);}
  #nextBtn:hover{filter:brightness(1.08);}


  .ghost{position:fixed;pointer-events:none;z-index:999;transform:translate(-50%,-50%);}
  .ghost.rotatedGhost{transform:translate(-50%,-50%) rotate(90deg);}

  #previewModal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;}
  #a4Sheet{background:#fff;width:min(70vw,420px);aspect-ratio:210/297;box-shadow:0 8px 30px rgba(0,0,0,.4);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:6px;padding:8px;}
  .a8slot{border:1px dashed #ccc;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fafafa;}
  .a8slot img{width:100%;height:100%;object-fit:cover;}
  #previewLabel{color:#fff;text-align:center;margin-bottom:10px;font-size:15px;}
  #previewBox{display:flex;flex-direction:column;align-items:center;}
</style>
</head>
<body>
<div id="rotateWrapper">
<div id="app">

  <div id="doneRail"></div>

  <div id="endScreen">
    <h1 id="endTitle">Gut gemacht!</h1>
    <div id="endClap">👏</div>
    <div id="endMenu"></div>
  </div>

  <div id="printSheet"></div>

  <div id="roundScreen">
    <div id="topBar">
      <div id="hintText">Ziehe das passende Verb auf das Bild.</div>
      <div id="palette"></div>
    </div>
    <div id="verbChoices"></div>
    <div id="stageWrap">
      <img id="stageImg" src="" alt="Comic">
      <img id="subjMaskImg" class="maskImg" alt="">
      <img id="datMaskImg" class="maskImg" alt="">
      <img id="datGreenMaskImg" class="maskImg" alt="">
      <img id="akkMaskImg" class="maskImg" alt="">
      <img id="akkGreenMaskImg" class="maskImg" alt="">
      <!-- Echte, unsichtbare Trefferzonen statt eigener Koordinaten-Umrechnung:
           der Browser positioniert/skaliert diese Elemente immer korrekt,
           unabhaengig von Drehung, Zoom oder Fenstergroesse (genau wie
           #verbLabel, das aus demselben Grund schon immer zuverlaessig war).
           Position/Groesse werden pro Runde aus den Masken berechnet. Muss
           VOR #verbLabel im DOM stehen, damit #verbLabel (eigener
           Klick-Handler zum Vorlesen) weiterhin obenauf liegt und
           antippbar bleibt. -->
      <div id="hitZoneGreen" class="hitZone" data-color="green" style="display:none;"></div>
      <div id="hitZonePurple" class="hitZone" data-color="purple" style="display:none;"></div>
      <div id="hitZoneYellow" class="hitZone" data-color="yellow" style="display:none;"></div>
      <div id="quickJumpZone" class="hitZone" data-color="quickjump" style="left:0;top:0;width:16%;height:22%;"></div>
      <div id="verbLabel"></div>
    </div>
    <div id="sentenceArea">
      <div id="sentenceRow">
        <div id="slots"></div>
      </div>
      <div id="tiles"></div>
      <div id="bottomBar">
        <div id="voiceRow">
          <button id="replaySpeakerBtn" class="iconBtn speakerBtn" title="Satz nochmal hören">🔊</button>
          <button id="micBtn" class="iconBtn micBtn" title="Satz nachsprechen">🎤</button>
          <button id="playbackBtn" class="iconBtn playbackBtn" title="Meine Aufnahme abspielen">🔊</button>
        </div>
        <div id="bottomRight">
          <button id="nextBtn">weiter →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="previewModal">
  <div id="previewBox">
    <div id="previewLabel">Druckvorschau – DIN A4 (A8-Kacheln)</div>
    <div id="a4Sheet"></div>
  </div>
</div>

    activeDragCleanups.slice().forEach(fn=>{ try{ fn(); }catch(e){} });
  }

// Passt die Buehnengroesse live an die tatsaechliche Bildschirmgroesse des
// Handys im Querformat an (robuster als reine vw/vh-Einheiten, die auf
// vielen mobilen Browsern durch ein-/ausblendende Adressleisten springen).
function adaptToLandscapeScreen(){
  // Nur noch --vw/--vh setzen (fuer den Drehungs-Trick, siehe
  // #rotateWrapper). Die Bildgroesse selbst wird NICHT mehr hier
  // geschaetzt/berechnet - das macht jetzt CSS ganz allein: #stageWrap ist
  // ein Flex-Element mit fester Bildproportion (aspect-ratio:600/422), das
  // automatisch immer den kompletten uebrigen Platz bekommt (siehe CSS).
  // Der Browser rechnet das bei jeder Fenstergroesse/Drehung sofort neu -
  // keine eigene, fehleranfaellige Platzberechnung mehr noetig.
  const w = window.innerWidth;
  const h = window.innerHeight;
  const root = document.documentElement.style;
  root.setProperty('--vw', w+'px');
  root.setProperty('--vh', h+'px');
}
adaptToLandscapeScreen();
window.addEventListener('resize', adaptToLandscapeScreen);
window.addEventListener('orientationchange', ()=>setTimeout(adaptToLandscapeScreen,300));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', adaptToLandscapeScreen);
}

// --stage-w (fuer alle proportional skalierten Schriften/Buttons/Icons)
// wird jetzt aus der TATSAECHLICH gerenderten Bildbreite abgeleitet, per
// ResizeObserver - beobachtet die echte, vom Browser berechnete Groesse,
// statt sie selbst zu schaetzen. Reagiert automatisch auf jede Aenderung.
const stageWrapEl = document.getElementById('stageWrap');
if(stageWrapEl && window.ResizeObserver){
  const ro = new ResizeObserver(entries=>{
    for(const entry of entries){
      const width = entry.contentRect.width;
      if(width>0) document.documentElement.style.setProperty('--stage-w', width+'px');
    }
  });
  ro.observe(stageWrapEl);
} else if(stageWrapEl){
  const syncStageW = ()=>{
    const width = stageWrapEl.getBoundingClientRect().width;
    if(width>0) document.documentElement.style.setProperty('--stage-w', width+'px');
  };
  syncStageW();
  window.addEventListener('resize', syncStageW);
}

// F1: schnell durch alle Bilder springen, zum Testen (unabhaengig vom
// normalen Spielfortschritt/Abschlussstatus).
// Versucht, das Handy im Querformat zu fixieren, damit es beim Neigen
// nicht selbsttaetig zurueck ins Hochformat dreht. Funktioniert nur in
// Browsern/Kontexten, die die Screen-Orientation-API unterstuetzen
// (z.B. nicht in Safari auf dem iPhone - dort bleibt der Rotations-Trick
// per CSS die einzige Absicherung).
let orientationWasLocked = false;
function lockOrientationLandscape(){
  try{
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').then(()=>{
        orientationWasLocked = true;
      }).catch(()=>{});
    }
  }catch(e){}
}
function restoreOrientation(){
  try{
    if(orientationWasLocked && screen.orientation && screen.orientation.unlock){
      screen.orientation.unlock();
      orientationWasLocked = false;
    }
  }catch(e){}
}
lockOrientationLandscape();

function buildVerbChoices(){
  verbChoicesEl.style.display='flex';
  verbChoicesEl.innerHTML='';
  const others = VERB_DATA.filter(v=>v.nr!==current.nr);
  const distractors = [];
  const pool = others.slice();
  while(distractors.length<4 && pool.length){
    const idx = Math.floor(Math.random()*pool.length);
    distractors.push(pool.splice(idx,1)[0]);
  }
  const choices = [current, ...distractors].sort(()=>Math.random()-0.5);
  choices.forEach(v=>{
    const b = document.createElement('div');
    b.className='verbBubble';
    b.textContent=v.inf;
    b.dataset.inf=v.inf;
    makeDraggableVerbBubble(b);
    verbChoicesEl.appendChild(b);
  });
}

function makeDraggableVerbBubble(el){
  el.addEventListener('pointerdown',(e)=>{
    if(verbMatched) return;
    e.preventDefault();
    const ghost = el.cloneNode(true);
    ghost.classList.add('ghost');
    if(window.matchMedia('(orientation:portrait)').matches) ghost.classList.add('rotatedGhost');
    ghost.style.width=el.offsetWidth+'px';
    document.body.appendChild(ghost);
    moveGhost(ghost,e);
    el.classList.add('dragging');
    const dragPointerId = e.pointerId;
    function onMove(ev){ if(ev.pointerId!==dragPointerId) return; moveGhost(ghost,ev); }
    function cleanupDrag(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      unregisterDragCleanup(cleanupDrag);
      ghost.remove();
      el.classList.remove('dragging');
    }
    function onUp(ev){
      if(ev.pointerId!==dragPointerId) return;
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      unregisterDragCleanup(cleanupDrag);
      ghost.remove();
      el.classList.remove('dragging');
      const overStage = isOverStage(ev.clientX, ev.clientY);
      if(overStage && el.dataset.inf === current.inf){
        verbMatched = true;
        placeVerbOnImage(el.dataset.inf);
      } else if(overStage){
        el.classList.add('wrongShake');
        setTimeout(()=>el.classList.remove('wrongShake'),350);
        buzz();
      } else {
        buzz();
      }
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
    registerDragCleanup(cleanupDrag);
  });
}
function isOverStage(x,y){
  const r = stageWrap.getBoundingClientRect();
  return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
}

function placeVerbOnImage(text){
  verbChoicesEl.style.display='none';
  const [x,y] = current.labelPos;
  verbLabel.textContent=text;
  verbLabel.style.left=x+'%';
  verbLabel.style.top=y+'%';
  verbLabel.style.pointerEvents='auto';
  verbLabel.style.cursor='pointer';
  requestAnimationFrame(()=>verbLabel.classList.add('show'));
  setTimeout(()=>{
    speak(text);
    startColoringPhase();
  }, 350);
}
verbLabel.addEventListener('click', ()=>{
  if(verbLabel.textContent) speak(verbLabel.textContent, {interrupt:true});
});

function startColoringPhase(){
  hintText.textContent='Ziehe die passende Farbe auf die richtige Figur im Bild.';

function buildPalette(){
  paletteEl.innerHTML='';
  const green = document.createElement('div');
  green.className='colorBlob blob-green';
  green.dataset.color='green';
  makeDraggableBlob(green);
  paletteEl.appendChild(green);
  if(current.dat){
    const purple = document.createElement('div');
    purple.className='colorBlob blob-purple';
    purple.dataset.color='purple';
    makeDraggableBlob(purple);
    paletteEl.appendChild(purple);
  }
  if(current.akk){
    const yellow = document.createElement('div');
    yellow.className='colorBlob blob-yellow';
    yellow.dataset.color='yellow';
    makeDraggableBlob(yellow);
    paletteEl.appendChild(yellow);
  }
}

function buzz(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type='square'; o.frequency.value=140;
    g.gain.value=0.15;
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+0.22);
    o.onended=()=>ctx.close();
  }catch(e){}
}

let speechQueue = [];
let speaking = false;
// Chrome has a long-known bug where speechSynthesis silently stops firing
// utterances after a while (especially once a page has spoken a lot / lost
// focus). Periodically nudging resume() and never trusting onend alone to
// unblock the game keeps things from getting permanently stuck.
try{
  setInterval(()=>{ try{ speechSynthesis.resume(); }catch(e){} }, 4000);
}catch(e){}

function speak(text, opts={}){
  const {interrupt=false, onDone=null} = opts;
  if(interrupt){
    speechQueue = [];
    speaking = false;
    try{ speechSynthesis.cancel(); }catch(e){}
    setTimeout(()=>{
      speechQueue.push({text, onDone});
      processSpeechQueue();
    }, 30);
    return;
  }
  speechQueue.push({text, onDone});
  processSpeechQueue();
}
function processSpeechQueue(){
  if(speaking || speechQueue.length===0) return;
  speaking = true;
  const item = speechQueue.shift();
  let done = false;
  const finish = ()=>{
    if(done) return;
    done = true;
    speaking = false;
    if(item.onDone) item.onDone();
    setTimeout(processSpeechQueue, 550); // Pause wie zwischen zwei Saetzen
  };
  // Watchdog: if the browser's speech engine never calls onend/onerror
  // (known Chrome bug), don't let the game hang - continue anyway.
  const watchdog = setTimeout(finish, 6000);
  try{
    const u = new SpeechSynthesisUtterance(item.text);
    u.lang='de-DE';
    u.onend = ()=>{ clearTimeout(watchdog); finish(); };
    u.onerror = ()=>{ clearTimeout(watchdog); finish(); };
    speechSynthesis.speak(u);
  }catch(e){
    clearTimeout(watchdog);
    finish();
  }
}

const akkGreenMaskImg = document.getElementById('akkGreenMaskImg');
const hitZoneGreen = document.getElementById('hitZoneGreen');
const hitZonePurple = document.getElementById('hitZonePurple');
const hitZoneYellow = document.getElementById('hitZoneYellow');
const quickJumpZone = document.getElementById('quickJumpZone');
const maskCanvasGreen = document.createElement('canvas'); maskCanvasGreen.width=600; maskCanvasGreen.height=422;
const maskCanvasPurple = document.createElement('canvas'); maskCanvasPurple.width=600; maskCanvasPurple.height=422;
const maskCanvasYellow = document.createElement('canvas'); maskCanvasYellow.width=600; maskCanvasYellow.height=422;
const maskCtxGreen = maskCanvasGreen.getContext('2d', {willReadFrequently:true});
const maskCtxPurple = maskCanvasPurple.getContext('2d', {willReadFrequently:true});
const maskCtxYellow = maskCanvasYellow.getContext('2d', {willReadFrequently:true});

function loadMaskCanvas(ctx, b64){
  return new Promise((resolve)=>{
    ctx.clearRect(0,0,600,422);
    if(!b64){ resolve(); return; }
    const img = new Image();
    img.onload=()=>{ ctx.drawImage(img,0,0,600,422); resolve(); };
    img.onerror=()=>resolve();
    img.src='data:image/png;base64,'+b64;
  });
}

// Berechnet die umschliessende Box aller sichtbaren (alpha>40) Pixel einer
// Maske, als Prozentwerte (0..100) relativ zur 600x422-Maskenflaeche - so
// laesst sich daraus ein ganz normales, prozentual positioniertes
// HTML-Element bauen (genau wie #verbLabel), das der Browser danach immer
// korrekt darstellt, unabhaengig von Drehung/Zoom/Fenstergroesse.
function computeMaskBBoxPercent(ctx){
  const data = ctx.getImageData(0,0,600,422).data;
  let minX=600, minY=422, maxX=-1, maxY=-1;
  for(let y=0;y<422;y++){
    const rowOff = y*600;
    for(let x=0;x<600;x++){
      if(data[(rowOff+x)*4+3] > 40){
        if(x<minX) minX=x;
        if(x>maxX) maxX=x;
        if(y<minY) minY=y;
        if(y>maxY) maxY=y;
      }
    }
  }
  if(maxX<0) return null;
  const padX = 2, padY = 2;
  minX = Math.max(0, minX-padX); maxX = Math.min(599, maxX+padX);
  minY = Math.max(0, minY-padY); maxY = Math.min(421, maxY+padY);
  return {
    left: minX/600*100,
    top: minY/422*100,
    width: (maxX-minX+1)/600*100,
    height: (maxY-minY+1)/422*100
  };
}

function positionHitZone(zoneEl, ctx, active){
  if(!active){ zoneEl.style.display='none'; return; }
  const box = computeMaskBBoxPercent(ctx);
  if(!box){ zoneEl.style.display='none'; return; }
  zoneEl.style.left = box.left+'%';
  zoneEl.style.top = box.top+'%';
  zoneEl.style.width = box.width+'%';
  zoneEl.style.height = box.height+'%';
  zoneEl.style.display = 'block';
}

async function buildZonesData(){
  subjMaskImg.src = current.maskGreen ? 'data:image/png;base64,'+current.maskGreen : '';
  subjMaskImg.style.opacity=0;

  datMaskImg.style.opacity=0;
  datGreenMaskImg.src = (current.dat && current.maskPurpleGreen) ? 'data:image/png;base64,'+current.maskPurpleGreen : '';
  datGreenMaskImg.style.opacity=0;
  akkMaskImg.src = (current.akk && current.maskYellow) ? 'data:image/png;base64,'+current.maskYellow : '';
  akkMaskImg.style.opacity=0;
  akkGreenMaskImg.src = (current.akk && current.maskYellowGreen) ? 'data:image/png;base64,'+current.maskYellowGreen : '';
  akkGreenMaskImg.style.opacity=0;
  await loadMaskCanvas(maskCtxGreen, current.maskGreen);

  await loadMaskCanvas(maskCtxYellow, current.akk ? current.maskYellow : null);
  positionHitZone(hitZoneGreen, maskCtxGreen, !!current.maskGreen);

  positionHitZone(hitZoneYellow, maskCtxYellow, !!(current.akk && current.maskYellow));
}

// Trefferzonen (.hitZone) sind nur grobe Rechtecke (Bounding-Box der
// Maske) - der Browser positioniert sie zwar immer korrekt (egal wie das
// Bild gedreht/skaliert ist), aber liegen zwei Zonen nah beieinander
// (z.B. Kleid und Tochter), koennen sich ihre Rechtecke ueberschneiden.
// Um das aufzuloesen, wird an einer moeglichen Trefferstelle zusaetzlich
// exakt in der ECHTEN Maske (Pixel-Alpha) nachgeprueft - unter Nutzung
// der eigenen, vom Browser garantiert korrekt berechneten Position DER
// ZONE SELBST (zoneEl.getBoundingClientRect()), nicht der ganzen,
// gedrehten Buehne - das macht auch diesen Teil unabhaengig von eigener
// Drehungs-Mathematik.
function pixelHitInZone(zoneEl, ctx, clientX, clientY){
  const r = zoneEl.getBoundingClientRect();
  if(r.width<=0 || r.height<=0) return false;
  const fx = (clientX-r.left)/r.width;
  const fy = (clientY-r.top)/r.height;
  if(fx<0||fx>1||fy<0||fy>1) return false;
  const boxLeftPct = parseFloat(zoneEl.style.left)||0;
  const boxTopPct = parseFloat(zoneEl.style.top)||0;
  const boxWidthPct = parseFloat(zoneEl.style.width)||0;
  const boxHeightPct = parseFloat(zoneEl.style.height)||0;
  const maskX = Math.round((boxLeftPct + fx*boxWidthPct)/100*600);
  const maskY = Math.round((boxTopPct + fy*boxHeightPct)/100*422);
  if(maskX<0||maskY<0||maskX>=600||maskY>=422) return false;
  const RADIUS = 6;
  const x0=Math.max(0,maskX-RADIUS), y0=Math.max(0,maskY-RADIUS);
  const x1=Math.min(599,maskX+RADIUS), y1=Math.min(421,maskY+RADIUS);
  const data = ctx.getImageData(x0,y0,x1-x0+1,y1-y0+1).data;
  for(let i=3;i<data.length;i+=4){ if(data[i]>40) return true; }
  return false;
}
function maskCtxForColor(color){
  if(color==='green') return maskCtxGreen;
  if(color==='purple') return maskCtxPurple;
  if(color==='yellow') return maskCtxYellow;
  return null;
}
// Welche Zone(n) liegen an dieser Stelle? elementsFromPoint() liefert
// ALLE uebereinanderliegenden Elemente (nicht nur das oberste), damit bei
// Ueberlappung jede echte Kandidatin gefunden wird - danach entscheidet
// die pixelgenaue Pruefung, welche davon wirklich getroffen wurde.
function zoneAt(clientX, clientY){
  const els = document.elementsFromPoint(clientX, clientY);
  for(const el of els){
    if(!el.classList || !el.classList.contains('hitZone')) continue;
    if(el.style.display==='none') continue;
    const color = el.dataset.color;
    if(color==='quickjump') continue;
    const ctx = maskCtxForColor(color);
    if(ctx && pixelHitInZone(el, ctx, clientX, clientY)) return color;
  }
  return null;
}
function isColorAt(clientX, clientY, color){
  const els = document.elementsFromPoint(clientX, clientY);
  for(const el of els){
    const zone = el.classList && el.classList.contains('hitZone') ? el : null;
    if(zone && zone.style.display!=='none' && zone.dataset.color===color){
      const ctx = maskCtxForColor(color);
      if(ctx && pixelHitInZone(zone, ctx, clientX, clientY)) return true;
    }
  }
  return false;
}
function showMask(img){
  if(img.complete && img.naturalWidth>0){
    img.style.opacity=1;
  } else {
    img.addEventListener('load', ()=>{ img.style.opacity=1; }, {once:true});
  }
}
function fillZone(color){
  if(color==='green') showMask(subjMaskImg);
  else if(color==='purple') showMask(datMaskImg);
  else showMask(akkMaskImg);
}

// Beim Antippen/Ueberfahren einer Figur wird das Wort im Nominativ mit
// Artikel gesprochen, die Zone kurz gruen eingefaerbt, danach ist wieder
// alles wie zuvor (Original-Farbe/-Zustand bleibt unveraendert erhalten).
function flashNominative(role){
  if(role==='green'){
    if(current.subj) speak(current.subj, {interrupt:true});
    return;
  }
  if(role==='purple' && current.datNom){
    const wasOpacity = datMaskImg.style.opacity;
    datMaskImg.style.opacity=0;
    datGreenMaskImg.style.opacity=1;
    speak(current.datNom, {interrupt:true});
    const ms = Math.min(4000, 700 + current.datNom.length*70);
    setTimeout(()=>{
      datGreenMaskImg.style.opacity=0;
      datMaskImg.style.opacity=wasOpacity;
    }, ms);
    return;
  }
  if(role==='yellow' && current.akkNom){
    const wasOpacity = akkMaskImg.style.opacity;
    akkMaskImg.style.opacity=0;
    akkGreenMaskImg.style.opacity=1;
    speak(current.akkNom, {interrupt:true});
    const ms = Math.min(4000, 700 + current.akkNom.length*70);
    setTimeout(()=>{
      akkGreenMaskImg.style.opacity=0;
      akkMaskImg.style.opacity=wasOpacity;
    }, ms);
  }
}

function quickJumpNext(){
  if(current){
    completedNrs.add(current.nr);
    if(!savedColoredImages[current.nr]){

    }

  const idx = sequence.findIndex(v=>v.nr===current.nr);
  if(idx === sequence.length-1){

    showEndScreen();
    return;

  startImageRound(next);
}

function makeDraggableBlob(el){
  el.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    const color = el.dataset.color;
    const ghost = el.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width=el.offsetWidth+'px';
    ghost.style.height=el.offsetHeight+'px';
    document.body.appendChild(ghost);
    moveGhost(ghost,e);
    el.classList.add('dragging');
    const dragPointerId = e.pointerId;
    function onMove(ev){ if(ev.pointerId!==dragPointerId) return; moveGhost(ghost,ev); }
    function cleanupDrag(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      unregisterDragCleanup(cleanupDrag);
      ghost.remove();
      el.classList.remove('dragging');
    }
    function onUp(ev){
      if(ev.pointerId!==dragPointerId) return;
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      unregisterDragCleanup(cleanupDrag);
      ghost.remove();
      el.classList.remove('dragging');
      const hit = isColorAt(ev.clientX, ev.clientY, color);
      const already = (color==='green' && placedSubj) || (color==='purple' && placedDat) || (color==='yellow' && placedAkk);
      if(hit && !already){
        fillZone(color);
        el.style.visibility='hidden';
        el.dataset.placed='1';
        if(color==='green') placedSubj=true;
        else if(color==='purple') placedDat=true;
        else placedAkk=true;
        checkColoringDone();
      } else {
        stageWrap.classList.add('shake');
        setTimeout(()=>stageWrap.classList.remove('shake'),300);
        buzz();
      }
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
    registerDragCleanup(cleanupDrag);
  });
}
function moveGhost(ghost,e){
  ghost.style.left=e.clientX+'px';
  ghost.style.top=e.clientY+'px';
}
function checkColoringDone(){
  const needDat = current.dat ? placedDat : true;
  const needAkk = current.akk ? placedAkk : true;
  if(placedSubj && needDat && needAkk){
    setTimeout(buildSentencePhase, 350);
  }
}

function buildSentencePhase(){
  hintText.textContent='Ziehe die Satzteile an die richtige Stelle.';
  slotsEl.innerHTML='';
  tilesEl.innerHTML='';
  const parts = [{type:'nom', text:current.subj}, {type:'verb', text:current.verb}];
  if(current.dat) parts.push({type:'dat', text:current.dat});
  if(current.akk) parts.push({type:'akk', text:current.akk});

  parts.forEach((p,i)=>{
    const s = document.createElement('div');
    s.className='slot slot-'+p.type;
    s.dataset.index=i;
    s.dataset.type=p.type;
    s.dataset.answer=p.text;
    slotsEl.appendChild(s);
  });

  const shuffledParts = parts.slice().sort(()=>Math.random()-0.5);
  shuffledParts.forEach(p=>{
    const t = document.createElement('div');
    t.className='tile tile-'+p.type;
    t.textContent=p.text;
    t.dataset.type=p.type;
    t.dataset.text=p.text;
    makeDraggableTile(t);
    tilesEl.appendChild(t);
  });
}

function makeDraggableTile(el){
  el.addEventListener('pointerdown',(e)=>{
    e.preventDefault();
    const ghost = el.cloneNode(true);
    ghost.classList.add('ghost');
    if(window.matchMedia('(orientation:portrait)').matches) ghost.classList.add('rotatedGhost');
    ghost.style.width=el.offsetWidth+'px';
    document.body.appendChild(ghost);
    moveGhost(ghost,e);
    el.classList.add('dragging');
    const dragPointerId = e.pointerId;
    function onMove(ev){ if(ev.pointerId!==dragPointerId) return; moveGhost(ghost,ev); }
    function cleanupDrag(){
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      unregisterDragCleanup(cleanupDrag);
      ghost.remove();
      el.classList.remove('dragging');
    }
    function onUp(ev){
      if(ev.pointerId!==dragPointerId) return;
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      unregisterDragCleanup(cleanupDrag);
      ghost.remove();
      el.classList.remove('dragging');
      const slot = findSlotAt(ev.clientX,ev.clientY);
      if(slot && !slot.classList.contains('filled')){
        if(slot.dataset.answer===el.dataset.text){
          slot.textContent = el.dataset.text;
          slot.classList.add('filled','hop');
          setTimeout(()=>slot.classList.remove('hop'),500);
          el.classList.add('hidden');
          speak(el.dataset.text);
          checkSentenceDone();
        } else {
          slot.classList.add('shake');
          setTimeout(()=>slot.classList.remove('shake'),300);
          buzz();
          el.classList.remove('dragging');
        }
      } else {
        buzz();
      }
    }
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
    registerDragCleanup(cleanupDrag);
  });
}
function findSlotAt(x,y){
  const els = document.elementsFromPoint(x,y);
  return els.find(el=>el.classList && el.classList.contains('slot'));
}

function checkSentenceDone(){
  const allFilled = [...slotsEl.children].every(s=>s.classList.contains('filled'));
  if(allFilled){
    currentSentence = [...slotsEl.children].map(s=>s.dataset.answer).join(' ')+'.';
    voiceRow.style.display='flex';
    speak(currentSentence);
    // Show "weiter" a little after the sentence starts, rather than
    // waiting on the browser's speech onend callback - some browsers
    // (esp. after several utterances) never fire it, which left the
    // button permanently missing.
    const readMs = Math.min(6000, 900 + currentSentence.length*70);
    setTimeout(()=>{ nextBtn.style.visibility='visible'; }, readMs);
  }
}

replaySpeakerBtn.addEventListener('click', ()=>{
  if(currentSentence) speak(currentSentence, {interrupt:true});
});

function pickMimeType(){
  const candidates = ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  for(const c of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume().catch(()=>{});
  }
  return audioCtx;
}
let lastAudioBuffer = null;
async function decodeRecording(blobUrl){
  try{
    const resp = await fetch(blobUrl);
    const arr = await resp.arrayBuffer();
    const ctx = getAudioCtx();
    lastAudioBuffer = await ctx.decodeAudioData(arr);
    return true;
  }catch(e){
    lastAudioBuffer = null;
    return false;
  }
}
function playRecording(){
  if(!lastAudioBuffer){
    alert('Wiedergabe nicht möglich: Die Aufnahme konnte nicht gelesen werden.');
    return;
  }
  const ctx = getAudioCtx();
  const src = ctx.createBufferSource();
  src.buffer = lastAudioBuffer;
  // Lautstaerke-Verstaerkung: auf manchen Geraeten (z.B. iPad) kommt die
  // eigene Aufnahme ueber diesen Web-Audio-Wiedergabepfad deutlich leiser
  // heraus als die Computerstimme. Kompressor VOR dem staerkeren Gain,
  // damit lautere Stellen nicht hart uebersteuern/verzerren.
  const compressor = ctx.createDynamicsCompressor();
  const gain = ctx.createGain();
  gain.gain.value = 6;
  src.connect(compressor);
  compressor.connect(gain);
  gain.connect(ctx.destination);
  src.start(0);
}

function stopRecording(){
  if(isRecording && mediaRecorder && mediaRecorder.state!=='inactive'){
    mediaRecorder.stop();
  }
  isRecording=false;
  micBtn.classList.remove('recording');
}

let cachedMicStream = null;
async function getMicStream(){
  if(cachedMicStream){
    const tracks = cachedMicStream.getAudioTracks();
    if(tracks.length && tracks[0].readyState==='live'){
      return cachedMicStream;
    }
    cachedMicStream = null;
  }
  cachedMicStream = await navigator.mediaDevices.getUserMedia({audio:true});
  return cachedMicStream;
}

let pendingAutoPlay = false;

async function beginRecording(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    alert('Mikrofon-Aufnahme wird in dieser Ansicht nicht unterstützt. Bitte die Seite direkt in Safari/Chrome öffnen (nicht über eine andere App).');
    return;
  }
  try{
    const stream = await getMicStream();
    audioChunks=[];
    const mimeType = pickMimeType();
    mediaRecorder = mimeType ? new MediaRecorder(stream,{mimeType}) : new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e=>{ if(e.data && e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async ()=>{
      const usedType = mediaRecorder.mimeType || mimeType || 'audio/webm';
      const blob = new Blob(audioChunks, {type:usedType});
      if(studentAudioURL) URL.revokeObjectURL(studentAudioURL);
      studentAudioURL = URL.createObjectURL(blob);
      await decodeRecording(studentAudioURL);
      if(pendingAutoPlay){
        pendingAutoPlay = false;
        playRecording();
      }
      // keep the mic stream open/cached for reuse - do NOT stop its tracks here,
      // stopping+re-requesting getUserMedia repeatedly is what caused recording
      // to silently stop working after a number of rounds.
    };
    // small timeslice so audio arrives in multiple chunks (avoids
    // truncated/duration bugs some browsers have with single-chunk blobs)
    mediaRecorder.start(100);
    isRecording=true;
    micBtn.classList.add('recording');
    playbackBtn.classList.add('ready');
  }catch(e){
    alert('Mikrofonzugriff nicht möglich: '+e.message);
  }
}

micBtn.addEventListener('click', async ()=>{
  if(isRecording){
    pendingAutoPlay = false;
    stopRecording();
    return;
  }
  await beginRecording();
});

playbackBtn.addEventListener('click', ()=>{
  if(isRecording){
    pendingAutoPlay = true;
    stopRecording();
    return;
  }
  if(studentAudioURL){
    playRecording();
  }
});

function composeColoredImage(cb){
  const canvas = document.createElement('canvas');
  const w=600,h=422;
  canvas.width=w; canvas.height=h;
  const ctx = canvas.getContext('2d');
  const base = new Image();
  base.onload=()=>{
    ctx.drawImage(base,0,0,w,h);
    const overlays = [];
    if(current.maskGreen) overlays.push(current.maskGreen);
    if(current.dat && current.maskPurple) overlays.push(current.maskPurple);
    if(current.akk && current.maskYellow) overlays.push(current.maskYellow);
    let remaining = overlays.length;
    if(remaining===0){ cb(canvas.toDataURL('image/jpeg',0.9)); return; }
    overlays.forEach(b64=>{
      const ov = new Image();
      ov.onload=()=>{
        ctx.drawImage(ov,0,0,w,h);
        remaining--;
        if(remaining===0) cb(canvas.toDataURL('image/jpeg',0.9));
      };
      ov.src='data:image/png;base64,'+b64;
    });
  };
  base.src = 'data:image/jpeg;base64,'+IMAGES[current.nr];
}

nextBtn.addEventListener('click', async ()=>{
  nextBtn.style.visibility='hidden';
  sentenceByNr[current.nr] = currentSentence;
  composeColoredImage(async (dataUrl)=>{
    savedColoredImages[current.nr] = dataUrl;
    completedNrs.add(current.nr);
    try{
      await window.storage.set('saved:'+current.nr, dataUrl, false);
      await window.storage.set('completed', JSON.stringify([...completedNrs]), false);
      await window.storage.set('sentences', JSON.stringify(sentenceByNr), false);
    }catch(e){}

    let page = printPages[printPages.length-1];
    if(page.length>=10){ page=[]; printPages.push(page); }
    page.push(dataUrl);

    showPrintPreview(page, ()=>{
      const rest = remainingSequence();
      if(rest.length){
        startImageRound(rest[0]);
      } else {
        roundScreen.style.display='none';
        renderDoneRail();
        showEndScreen();
      }
    });
  });
});

function doPrint(){
  const sheet = document.getElementById('printSheet');
  sheet.innerHTML='';
  sequence.slice().sort((a,b)=>a.nr-b.nr).forEach(v=>{
    if(!savedColoredImages[v.nr]) return;
    const card = document.createElement('div');
    card.className='printCard';
    const img = document.createElement('img');
    img.src = savedColoredImages[v.nr];
    const p = document.createElement('p');
    p.textContent = sentenceByNr[v.nr] || '';
    card.appendChild(img);
    card.appendChild(p);
    sheet.appendChild(card);
  });
  window.print();
}
function doPracticeAgain(){
  completedNrs = new Set();
  sequence = VERB_DATA.slice().sort(()=>Math.random()-0.5);
  endScreen.style.display='none';
  startImageRound(sequence[0]);
}
function doRestartSameOrder(){
  completedNrs = new Set();
  sequence = VERB_DATA.slice().sort((a,b)=>a.nr-b.nr);
  endScreen.style.display='none';
  startImageRound(sequence[0]);
}
function doEnd(){
  restoreOrientation();
  window.location.href = 'Startseite.html';
}
function renderEndMenu(buttons){
  const menu = document.getElementById('endMenu');
  menu.innerHTML = '';
  buttons.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'endBtn';
    btn.textContent = b.label;
    const rot = (Math.random()*10-5).toFixed(1);
    btn.style.transform = `rotate(${rot}deg)`;
    btn.addEventListener('click', b.action);
    menu.appendChild(btn);
  });
}
function showEndScreen(){
  document.getElementById('endMenu').style.display='flex';
  document.getElementById('endClap').style.display='';
  document.getElementById('endTitle').textContent = 'Gut gemacht!';
  renderEndMenu([
    {label:'Verb mit Nominativ, Dativ und Akkusativ', action:()=>{ window.location.href='Verbtheater_NDA.html'; }},
    {label:'nochmal', action:doRestartSameOrder},
    {label:'zufällig', action:doPracticeAgain},
    {label:'jetzt drucken', action:doPrint},
    {label:'Tschüs', action:doEnd}
  ]);
  endScreen.style.display='flex';
}

function showPrintPreview(page, done){
  const sheet = document.getElementById('a4Sheet');
  sheet.innerHTML='';
  for(let i=0;i<10;i++){
    const slot = document.createElement('div');
    slot.className='a8slot';
    if(page[i]){
      const im = document.createElement('img');
      im.src = page[i];
      slot.appendChild(im);
    }
    sheet.appendChild(slot);
  }
  const modal = document.getElementById('previewModal');
  modal.style.display='flex';
  setTimeout(()=>{
    modal.style.display='none';
    done();
  }, 1600);
}

(async function init(){
  // Beim Uebergang von der Startseite zum ersten Bild einmal kurz das
  // Mikrofon anfordern. Das schaltet auf iOS die Audio-Sitzung der Seite
  // auf eine vollwertige Kategorie um, die zuverlaessig hoerbar ist -
  // ohne diesen Schritt bleibt Ton (Sprachausgabe wie eigene Aufnahme)
  // beim allerersten Bild sonst stumm. Der Stream wird gecacht und bei
  // der spaeteren echten Aufnahme wiederverwendet (keine zweite Abfrage).
  try{ await getMicStream(); }catch(e){}
  try{
    const c = await window.storage.get('completed', false);
    if(c && c.value){
      JSON.parse(c.value).forEach(nr=>completedNrs.add(nr));
      for(const nr of completedNrs){
        const r = await window.storage.get('saved:'+nr, false).catch(()=>null);
        if(r && r.value) savedColoredImages[nr]=r.value;
      }
    }
    const s = await window.storage.get('sentences', false).catch(()=>null);
    if(s && s.value) sentenceByNr = JSON.parse(s.value);
  }catch(e){}
  const rest = remainingSequence();
  if(rest.length){
    startImageRound(rest[0]);
  } else {
    renderDoneRail();
    showEndScreen();
  }
})();
