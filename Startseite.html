<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sprachtheater – Start</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
  :root{ --vw: 100vw; --vh: 100vh; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;font-family:'Comic Sans MS','Comic Neue',Bubblegum,'Baloo 2',sans-serif;background:#faf7f0;overflow:hidden;touch-action:manipulation;}
  /* Querformat-Simulation fuer Hochkant-Handbetrieb (identisch zum Spiel):
     dreht die ganze Seite um 90 Grad, damit sie wie im Spiel im
     "Querformat" dargestellt wird, auch wenn das Telefon hochkant
     gehalten wird. */
  #rotateWrapper{width:100%;height:100%;}
  @media screen and (orientation:portrait){
    #rotateWrapper{
      position:absolute;
      top:0; left:100%;
      width:var(--vh);
      height:var(--vw);
      transform-origin:0 0;
      transform:rotate(90deg);
    }
  }
  #stage{position:relative;width:100%;height:100%;}
  h1{position:absolute;top:5%;left:50%;transform:translateX(-50%);font-size:clamp(22px,4vw,38px);color:#4a4a4a;text-align:center;margin:0;}
  #versionTag{position:absolute;top:6px;left:8px;font-size:12px;color:#bbb;}
  .tile{position:absolute;background:#fff;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;cursor:pointer;text-decoration:none;color:#2a2a2a;font-size:clamp(15px,2.1vw,22px);line-height:1.25;transition:transform .15s;border:4px solid transparent;}
  .tile:hover{transform:scale(1.05);}
  .tile:active{transform:scale(.97);}

  #tile1{width:30%;height:26%;left:6%;top:22%;transform:rotate(-4deg);border-color:#2fa32f;background:#eafbea;}
  #tile1:hover{transform:rotate(-4deg) scale(1.05);}
  #tile2{width:22%;height:20%;left:62%;top:14%;transform:rotate(3deg);border-color:#e0b400;background:#fffaeb;}
  #tile2:hover{transform:rotate(3deg) scale(1.05);}
  #tile3{width:26%;height:22%;left:40%;top:56%;transform:rotate(-2deg);border-color:#9662c8;background:#f6efff;}
  #tile3:hover{transform:rotate(-2deg) scale(1.05);}
  #tile4{width:20%;height:18%;left:8%;top:64%;transform:rotate(5deg);border-color:#e06c4b;background:#fff1ec;}
  #tile4:hover{transform:rotate(5deg) scale(1.05);}

  @media (max-width:600px){
    .tile{font-size:14px;padding:10px;}
    #tile1{width:38%;height:24%;left:4%;top:20%;}
    #tile2{width:36%;height:20%;left:56%;top:12%;}
    #tile3{width:38%;height:22%;left:30%;top:58%;}
    #tile4{width:32%;height:18%;left:4%;top:66%;}
  }
</style>
</head>
<body>
<div id="rotateWrapper">
<div id="stage">
  <div id="versionTag">v6.7</div>
  <h1>Sprachtheater</h1>
  <a id="tile1" class="tile" href="verbtheater.html">Verben mit Nominativ, Dativ, Akkusativ</a>
  <a id="tile2" class="tile" href="Praepositionen.html">Präpositionen mit Dativ und Akkusativ</a>
  <!-- Noch nicht fertig - vorerst ausgeblendet, Code bleibt fuer spaeter erhalten:
  <a id="tile3" class="tile" href="UnterKonstruktion.html?titel=Satzbauschema">Satzbauschema</a>
  <a id="tile4" class="tile" href="UnterKonstruktion.html?titel=Hauptsatz-Nebensatz">Hauptsatz–Nebensatz</a>
  -->
</div>
</div>
<script>
  // --vw/--vh fuer den Drehungs-Trick oben aktuell halten (identisch zum
  // Spiel) - reagiert auf Fenstergroessen-/Ausrichtungsaenderungen.
  function syncVwVh(){
    document.documentElement.style.setProperty('--vw', window.innerWidth+'px');
    document.documentElement.style.setProperty('--vh', window.innerHeight+'px');
  }
  syncVwVh();
  window.addEventListener('resize', syncVwVh);
  window.addEventListener('orientationchange', ()=>setTimeout(syncVwVh,300));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', syncVwVh);
  }
</script>
</body>
</html>
